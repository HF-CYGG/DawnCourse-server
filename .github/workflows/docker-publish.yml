name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - v*.*
      - v*.*.*
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: dawncourse-server
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/hf-cygg/dawncourse-server
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
  GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || github.token }}
  DOCKER_HUB_IMAGE: ${{ secrets.DOCKERHUB_NAMESPACE != '' && format('{0}/{1}', secrets.DOCKERHUB_NAMESPACE, 'dawncourse-server') || 'yemiao351/dawncourse' }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
  DOCKER_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
  ALIYUN_REGISTRY: crpi-9gmsq2s17re73ia9.cn-qingdao.personal.cr.aliyuncs.com
  ALIYUN_NAMESPACE: yyh163
  ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
  ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check GHCR authentication mode
        shell: bash
        env:
          HAS_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "${HAS_GHCR_TOKEN}" == "true" ]]; then
            echo "Using GHCR_TOKEN for ghcr.io push."
          else
            echo "::warning::GHCR_TOKEN is not configured. Falling back to the workflow GITHUB_TOKEN. If ghcr.io push still fails with unauthorized, create a repository secret named GHCR_TOKEN with write:packages permission."
          fi

      - name: Validate required Aliyun ACR secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ALIYUN_USERNAME}" || -z "${ALIYUN_PASSWORD}" ]]; then
            echo "Aliyun ACR is mandatory, but ALIYUN_USERNAME or ALIYUN_PASSWORD is missing." >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PASSWORD }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_PASSWORD != '' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_PASSWORD }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USERNAME }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          declare -a suffixes=()
          short_sha="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            suffixes+=("${GITHUB_REF_NAME}")
            suffixes+=("sha-${short_sha}")
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              suffixes+=("latest")
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            suffixes+=("${GITHUB_REF_NAME}")
            suffixes+=("sha-${short_sha}")
          else
            suffixes+=("sha-${short_sha}")
          fi

          mapfile -t unique_suffixes < <(printf "%s\n" "${suffixes[@]}" | awk 'NF && !seen[$0]++')

          build_tag_block() {
            local image="$1"
            shift
            local block=""
            for suffix in "$@"; do
              block+="${image}:${suffix}"$'\n'
            done
            printf "%s" "${block}"
          }

          {
            echo "ghcr<<EOF"
            build_tag_block "${GHCR_IMAGE}" "${unique_suffixes[@]}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          if [[ -n "${DOCKER_HUB_USERNAME}" && -n "${DOCKER_HUB_PASSWORD}" && -n "${DOCKER_HUB_IMAGE}" ]]; then
            {
              echo "dockerhub<<EOF"
              build_tag_block "${DOCKER_HUB_IMAGE}" "${unique_suffixes[@]}"
              echo
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

          {
            echo "aliyun<<EOF"
            build_tag_block "${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}" "${unique_suffixes[@]}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.ghcr }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image to Docker Hub
        if: ${{ steps.tags.outputs.dockerhub != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.dockerhub }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image to Aliyun ACR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.aliyun }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
