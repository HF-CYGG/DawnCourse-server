# 文件说明：此片段必须加载在 1Panel/OpenResty 的 stream 上下文中。
# HTTP 直接进入 Dawn Course 容器，TLS 则透传到独立的 10443 HTTPS 站点终止证书。
map $ssl_preread_protocol $dawn_update_upstream {
    # 非 TLS 首包：兼容 1.0.6.0 及更早版本的固定 HTTP 更新入口。
    ""      127.0.0.1:15000;
    # TLS ClientHello：兼容 1.0.6.1 及后续版本的固定 HTTPS 更新入口。
    default 127.0.0.1:10443;
}

server {
    listen 10000;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
    proxy_pass $dawn_update_upstream;
    ssl_preread on;
}
