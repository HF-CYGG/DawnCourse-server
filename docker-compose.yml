version: '3'
services:
  app-server:
    # nginx 静态资源 + API 反代入口
    build: .
    ports:
      - "10000:80"
      - "8080:80"
      - "15000:15000"
    restart: ${RESTART_POLICY:-no}
    volumes:
      - parsers-data:/shared/parsers
      - parsers-data:/var/log/nginx
    command:
      [
        "/bin/sh",
        "-c",
        "mkdir -p /shared/parsers /var/log/nginx && touch /shared/parsers/llm-backend.log /var/log/nginx/nginx_access.log /var/log/nginx/nginx_error.log && echo '[log-bridge] app-server bridge started'; tail -n +1 -F /shared/parsers/llm-backend.log /var/log/nginx/nginx_access.log /var/log/nginx/nginx_error.log & exec nginx -g 'daemon off;'"
      ]
    depends_on:
      llm-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      dawn-net:
        ipv4_address: 172.31.250.2
  llm-backend:
    # LLM 异步解析服务
    build: ./llm-backend
    environment:
      # 模型 1（总结）配置
      LLM_SUMMARY_PROVIDER: gpt
      LLM_SUMMARY_API_KEY: ""
      LLM_SUMMARY_MODEL: gpt-4o-mini
      LLM_SUMMARY_BASE_URL: ""
      # 模型 2（脚本修复）配置
      LLM_SCRIPT_PROVIDER: gpt
      LLM_SCRIPT_API_KEY: ""
      LLM_SCRIPT_MODEL: gpt-4o
      LLM_SCRIPT_BASE_URL: ""
      REDIS_URL: redis://redis:6379
      # 脚本输出目录
      SCRIPT_OUTPUT_DIR: /shared/parsers
      # 单次请求超时
      LLM_TIMEOUT_MS: 20000
      # 最大请求体长度
      MAX_CONTENT_LENGTH: 200000
      # 任务缓存最大存活时长
      TASK_TTL_MS: 1800000
      # 队列触发阈值
      MIN_QUEUE_SIZE: 3
      # 合并窗口
      MERGE_WINDOW_MS: 600000
      # 24 小时内二次提交处理窗口
      REPROCESS_WINDOW_MS: 86400000
      RATE_LIMIT_PER_MIN: 120
      RATE_LIMIT_SCHOOL_PER_MIN: 60
      LLM_SUMMARY_COST_PER_CALL: 0
      LLM_SCRIPT_COST_PER_CALL: 0
      LLM_PARSE_COST_PER_CALL: 0
      SCRIPT_SIGN_KEY: ""
      SCRIPT_SIGN_PRIVATE_KEY: ""
      SCHOOL_METRICS_FILE: /shared/parsers/metrics/school_metrics.txt
      METRICS_FLUSH_MS: 5000
      ADMIN_SESSION_TTL_MS: 43200000
      BACKEND_MIRROR_LOG_FILE: /shared/parsers/llm-backend.log
    volumes:
      - parsers-data:/shared/parsers
    restart: ${RESTART_POLICY:-no}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      dawn-net:
        ipv4_address: 172.31.250.3
  redis:
    image: redis:7-alpine
    restart: ${RESTART_POLICY:-no}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      dawn-net:
        ipv4_address: 172.31.250.4

volumes:
  redis-data:
  parsers-data:

networks:
  dawn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/24
