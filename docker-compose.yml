version: '3'
services:
  app-server:
    # nginx 静态资源 + API 反代入口
    build: .
    ports:
      - "10000:80"
    restart: always
    depends_on:
      - llm-backend
  llm-backend:
    # LLM 异步解析服务
    build: ./llm-backend
    environment:
      # 模型提供方
      LLM_PROVIDER: gpt
      # 模型密钥
      LLM_API_KEY: ""
      # 模型名称
      LLM_MODEL: gpt-4o-mini
      # 自定义模型网关（为空则走默认）
      LLM_BASE_URL: ""
      # 单次请求超时
      LLM_TIMEOUT_MS: 20000
      # 最大请求体长度
      MAX_CONTENT_LENGTH: 200000
      # 任务缓存最大存活时长
      TASK_TTL_MS: 1800000
    restart: always
