version: '3'
services:
  app-server:
    # nginx 静态资源 + API 反代入口
    build: .
    ports:
      # 公网 10000 由宿主机 1Panel/OpenResty 终止 TLS，再反代到本服务的 15000。
      # 不要在容器侧重复占用 10000，否则 https://yyh163.xyz:10000 无法监听。
      - "8080:80"
      - "15000:15000"
    restart: ${RESTART_POLICY:-no}
    environment:
      # 使用 Docker 内置 DNS，供 nginx 在运行期动态解析 llm-backend 服务名
      NGINX_DNS_RESOLVER: 127.0.0.11
      LLM_BACKEND_UPSTREAM: llm-backend:8080
    volumes:
      - ./data/parsers:/shared/parsers
      - ./data/nginx:/var/log/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./version.json:/usr/share/nginx/html/version.json:ro
    command:
      [
        "/bin/sh",
        "-c",
        "mkdir -p /shared/parsers /var/log/nginx && touch /shared/parsers/llm-backend.log /var/log/nginx/nginx_access.log /var/log/nginx/nginx_error.log && echo '[log-bridge] app-server bridge started'; i=0; until wget -q -O - http://llm-backend:8080/health >/dev/null 2>&1 || [ \"$i\" -ge 60 ]; do i=$((i+1)); sleep 1; done; sed -e \"s#__LLM_BACKEND_UPSTREAM__#$${LLM_BACKEND_UPSTREAM}#g\" -e \"s#__NGINX_DNS_RESOLVER__#$${NGINX_DNS_RESOLVER}#g\" /etc/nginx/nginx.conf > /tmp/nginx.conf; nginx -t -c /tmp/nginx.conf; tail -n 0 -F /shared/parsers/llm-backend.log /var/log/nginx/nginx_access.log /var/log/nginx/nginx_error.log & exec nginx -g 'daemon off;' -c /tmp/nginx.conf"
      ]
    depends_on:
      llm-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 统一走 nginx 对外暴露的 /health，避免根路径 404 导致容器被误判为不健康
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dawn-net
  llm-backend:
    # LLM 异步解析服务
    build: ./llm-backend
    environment:
      # 模型 1（总结）配置
      LLM_SUMMARY_PROVIDER: gpt
      LLM_SUMMARY_API_KEY: ""
      LLM_SUMMARY_MODEL: gpt-4o-mini
      LLM_SUMMARY_BASE_URL: ""
      # 模型 2（脚本修复）配置
      LLM_SCRIPT_PROVIDER: gpt
      LLM_SCRIPT_API_KEY: ""
      LLM_SCRIPT_MODEL: gpt-4o
      LLM_SCRIPT_BASE_URL: ""
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://dawn:${POSTGRES_PASSWORD:-dawn}@postgres:5432/dawn_course
      RUNNER_URL: http://script-runner:8090
      # 脚本输出目录
      SCRIPT_OUTPUT_DIR: /shared/parsers
      # 挂载原始脚本以便自动迁移并生成 meta.json（runtime 目录存放共享执行契约 script_host.js）
      LEGACY_SCRIPT_OUTPUT_DIRS: /shared/scripts/parsers,/shared/scripts/js,/shared/scripts/runtime
      # 单次请求超时
      LLM_TIMEOUT_MS: 20000
      # 最大请求体长度
      MAX_CONTENT_LENGTH: 200000
      # 任务缓存最大存活时长
      TASK_TTL_MS: 1800000
      # 队列触发阈值
      MIN_QUEUE_SIZE: 3
      # 合并窗口
      MERGE_WINDOW_MS: 600000
      # 24 小时内二次提交处理窗口
      REPROCESS_WINDOW_MS: 86400000
      RATE_LIMIT_PER_MIN: 120
      RATE_LIMIT_SCHOOL_PER_MIN: 60
      LLM_SUMMARY_COST_PER_CALL: 0
      LLM_SCRIPT_COST_PER_CALL: 0
      LLM_PARSE_COST_PER_CALL: 0
      SCRIPT_SIGN_KEY: ""
      SCHOOL_METRICS_FILE: /shared/parsers/metrics/school_metrics.txt
      METRICS_FLUSH_MS: 5000
      ADMIN_SESSION_TTL_MS: 43200000
      BACKEND_MIRROR_LOG_FILE: /shared/parsers/llm-backend.log
    volumes:
      - ./data/parsers:/shared/parsers
      - ./html/scripts:/shared/scripts:ro
    restart: ${RESTART_POLICY:-no}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      script-runner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - dawn-net
  script-runner:
    build: ./script-runner
    restart: ${RESTART_POLICY:-no}
    volumes:
      # 共享执行契约的兜底来源。正常情况下由 llm-backend 随请求下发 harnessSource，
      # 这里仅用于后端未携带时（如独立调试）的降级读取。
      - ./html/scripts:/shared/scripts:ro
    environment:
      PORT: 8090
      MAX_RUNNER_BODY: 1048576
      SCRIPT_HOST_PATH: /shared/scripts/runtime/script_host.js
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - dawn-net
  postgres:
    image: postgres:16-alpine
    restart: ${RESTART_POLICY:-no}
    environment:
      POSTGRES_DB: dawn_course
      POSTGRES_USER: dawn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawn}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawn -d dawn_course"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dawn-net
  redis:
    image: redis:7-alpine
    restart: ${RESTART_POLICY:-no}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dawn-net

networks:
  dawn-net:
    driver: bridge
