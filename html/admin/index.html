<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawn Course 兜底解析监控</title>
    <style>
      /* 主题色与基础变量 */
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1f2430;
        --text: #e6e9ef;
        --muted: #9aa4b2;
        --accent: #5b9dff;
        --accent-2: #33d69f;
        --danger: #ff6b6b;
        --warning: #f6c177;
        --border: #2b303b;
        --shadow: rgba(0, 0, 0, 0.35);
      }
      /* 基础布局 */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden; /* App wrapper handles scroll */
      }
      .app-wrapper {
        display: flex;
        height: 100vh;
        width: 100vw;
      }
      /* 侧边栏 */
      .sidebar {
        width: 240px;
        background: var(--panel-2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .sidebar-header {
        padding: 24px 28px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
      }
      .sidebar-header h1 {
        font-size: 18px;
        margin: 0;
        color: var(--text);
      }
      .sidebar-nav {
        flex: 1;
        padding: 16px 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
      }
      .nav-item {
        padding: 12px 28px;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .nav-item:hover {
        background: rgba(91, 157, 255, 0.08);
        color: var(--text);
      }
      .nav-item.active {
        background: rgba(91, 157, 255, 0.15);
        color: var(--accent);
        border-right: 3px solid var(--accent);
      }
      .sidebar-footer {
        padding: 24px 28px;
        border-top: 1px solid var(--border);
      }
      /* 主内容区 */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        background: var(--bg);
      }
      /* 页面分段显示 */
      .page-section {
        display: none;
      }
      .page-section.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      /* 顶部栏 */
      header {
        padding: 24px 28px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, #171a21 0%, #11141a 100%);
      }
      header h2 {
        font-size: 20px;
        margin: 0;
      }
      header .meta {
        font-size: 12px;
        color: var(--muted);
      }
      /* 内容容器 */
      .container {
        padding: 24px 28px 48px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      /* 网格布局 */
      .grid {
        display: grid;
        gap: 16px;
      }
      .grid.cards {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      /* 统计卡片 */
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 10px 30px var(--shadow);
      }
      .card h3 {
        margin: 0 0 8px 0;
        font-size: 14px;
        color: var(--muted);
      }
      .card .value {
        font-size: 26px;
        font-weight: 600;
      }
      .card .sub {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .section-title {
        font-size: 16px;
        margin: 0 0 12px 0;
      }
      /* 数据表格 */
      .table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .table th,
      .table td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-size: 12px;
      }
      .table th {
        color: var(--muted);
        background: var(--panel-2);
      }
      .table tr:hover td {
        background: rgba(91, 157, 255, 0.08);
      }
      /* 状态标签 */
      .badge {
        display: inline-flex;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        background: rgba(91, 157, 255, 0.2);
        color: var(--accent);
      }
      .badge.success {
        background: rgba(51, 214, 159, 0.2);
        color: var(--accent-2);
      }
      .badge.warning {
        background: rgba(246, 193, 119, 0.2);
        color: var(--warning);
      }
      .badge.danger {
        background: rgba(255, 107, 107, 0.2);
        color: var(--danger);
      }
      /* 操作按钮区 */
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .btn {
        background: var(--accent);
        border: none;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .btn.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-end;
        justify-content: space-between;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
      }
      .filters {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .filter {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 160px;
      }
      .filter label {
        font-size: 12px;
        color: var(--muted);
      }
      .filter select {
        background: #10141c;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 8px;
      }
      .failure-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      /* 登录遮罩 */
      .login-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 12, 16, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 10;
      }
      /* 登录面板 */
      .login-panel {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 40px var(--shadow);
      }
      .login-panel h2 {
        margin: 0 0 16px 0;
        font-size: 18px;
      }
      /* 表单行 */
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      .form-row input {
        background: #10141c;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      /* 双列布局 */
      .split {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 16px;
      }
      @media (max-width: 960px) {
        .split {
          grid-template-columns: 1fr;
        }
      }
      /* 配置表单 */
      .config-form {
        display: grid;
        gap: 24px;
        max-width: 800px;
      }
      .config-group {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      .config-group h3 {
        margin: 0 0 16px 0;
        font-size: 16px;
        color: var(--accent);
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }
      .config-row {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
      }
      .config-row:last-child {
        margin-bottom: 0;
      }
      .config-row label {
        font-size: 13px;
        color: var(--muted);
        text-align: right;
      }
      .config-row input, .config-row select, .config-row textarea {
        background: #10141c;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 13px;
        width: 100%;
      }
      .config-row textarea {
        resize: vertical;
        min-height: 60px;
      }
      .config-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 12px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
      }
      .switch input { 
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--border);
        transition: .3s;
        border-radius: 24px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: var(--muted);
        transition: .3s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: rgba(91, 157, 255, 0.4);
      }
      input:checked + .slider:before {
        transform: translateX(20px);
        background-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="app-wrapper">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Dawn Course 解析监控</h1>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-item active" data-target="page-dashboard">
            概览与监控
          </div>
          <div class="nav-item" data-target="page-config">
            模型配置
          </div>
        </nav>
        <div class="sidebar-footer">
          <button class="btn secondary" id="logoutBtn" type="button" style="width: 100%;">退出登录</button>
        </div>
      </aside>

      <div class="main-content">
        <header>
          <div>
            <h2 id="pageTitle">概览与监控</h2>
            <div class="meta" id="headerMeta">等待数据…</div>
          </div>
          <div class="actions">
            <button class="btn secondary" id="refreshBtn" type="button">刷新数据</button>
          </div>
        </header>

        <main class="container">
          <!-- 概览与监控页面 -->
          <div id="page-dashboard" class="page-section active">
            <!-- 顶部汇总卡片 -->
            <section style="margin-bottom: 24px;">
              <div class="grid cards" id="summaryCards"></div>
            </section>
            <section class="filter-bar" style="margin-bottom: 24px;">
              <div class="filters">
                <div class="filter">
                  <label>学校筛选</label>
                  <select id="filterSchool"></select>
                </div>
                <div class="filter">
                  <label>教务类型</label>
                  <select id="filterSystemType"></select>
                </div>
                <div class="filter">
                  <label>失败类型</label>
                  <select id="filterFailureType"></select>
                </div>
              </div>
              <div class="actions">
                <button class="btn secondary" id="exportBtn" type="button">导出统计</button>
              </div>
            </section>
            <!-- 学校维度统计与失败记录 -->
            <section class="split">
              <div>
                <h3 class="section-title">学校维度统计</h3>
                <table class="table" id="schoolTable">
                  <thead>
                    <tr>
                      <th>学校</th>
                      <th>名称</th>
                      <th>教务系统</th>
                      <th>队列</th>
                      <th>成功率</th>
                      <th>解析</th>
                      <th>总结</th>
                      <th>脚本</th>
                      <th>费用</th>
                      <th>最近更新</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div>
                <h3 class="section-title">最近失败</h3>
                <div class="failure-summary" id="failureSummary"></div>
                <table class="table" id="failureTable">
                  <thead>
                    <tr>
                      <th>学校</th>
                      <th>脚本</th>
                      <th>类型</th>
                      <th>原因</th>
                      <th>时间</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </section>
          </div>

          <!-- 模型配置页面 -->
          <div id="page-config" class="page-section">
            <div class="config-form">
              <div class="config-group">
                <h3>模型 1：总结与解析（低成本）</h3>
                <div class="config-row">
                  <label>供应商 (Provider)</label>
                  <select id="conf_summaryProviderRaw">
                    <option value="auto">自动推断 (auto)</option>
                    <option value="gpt">OpenAI (gpt)</option>
                    <option value="gemini">Gemini (gemini)</option>
                    <option value="glm">智谱 (glm)</option>
                    <option value="deepseek">DeepSeek (deepseek)</option>
                    <option value="qwen">通义千问 (qwen)</option>
                  </select>
                </div>
                <div class="config-row">
                  <label>模型名称</label>
                  <input type="text" id="conf_summaryModelRaw" placeholder="如: gpt-4o-mini, gemini-1.5-flash">
                </div>
                <div class="config-row">
                  <label>API Key</label>
                  <input type="password" id="conf_summaryApiKey" placeholder="输入密钥">
                </div>
                <div class="config-row">
                  <label>Base URL</label>
                  <input type="text" id="conf_summaryBaseUrl" placeholder="为空则使用默认">
                </div>
                <div class="config-row">
                  <label>API 风格</label>
                  <select id="conf_summaryApiStyleRaw">
                    <option value="">自动推断</option>
                    <option value="chat">Chat Completions</option>
                    <option value="responses">Responses API</option>
                  </select>
                </div>
                <div class="config-row">
                  <label>扩展请求体 (JSON)</label>
                  <textarea id="conf_summaryRequestExtraJson" placeholder='如: {"response_format": {"type": "json_object"}}'></textarea>
                </div>
              </div>

              <div class="config-group">
                <h3>模型 2：脚本修复（高成本）</h3>
                <div class="config-row">
                  <label>供应商 (Provider)</label>
                  <select id="conf_scriptProviderRaw">
                    <option value="auto">自动推断 (auto)</option>
                    <option value="gpt">OpenAI (gpt)</option>
                    <option value="gemini">Gemini (gemini)</option>
                    <option value="glm">智谱 (glm)</option>
                    <option value="deepseek">DeepSeek (deepseek)</option>
                    <option value="qwen">通义千问 (qwen)</option>
                  </select>
                </div>
                <div class="config-row">
                  <label>模型名称</label>
                  <input type="text" id="conf_scriptModelRaw" placeholder="如: gpt-4o, gemini-1.5-pro">
                </div>
                <div class="config-row">
                  <label>API Key</label>
                  <input type="password" id="conf_scriptApiKey" placeholder="输入密钥">
                </div>
                <div class="config-row">
                  <label>Base URL</label>
                  <input type="text" id="conf_scriptBaseUrl" placeholder="为空则使用默认">
                </div>
                <div class="config-row">
                  <label>API 风格</label>
                  <select id="conf_scriptApiStyleRaw">
                    <option value="">自动推断</option>
                    <option value="chat">Chat Completions</option>
                    <option value="responses">Responses API</option>
                  </select>
                </div>
                <div class="config-row">
                  <label>扩展请求体 (JSON)</label>
                  <textarea id="conf_scriptRequestExtraJson" placeholder='如: {"response_format": {"type": "json_object"}}'></textarea>
                </div>
              </div>

              <div class="config-group">
                <h3>模型深度适配与统计配置</h3>
                <div class="config-row">
                  <label>别名映射 (JSON)</label>
                  <textarea id="conf_modelAliasJson" placeholder='如: {"glm5 5.1": "glm-5-1"}'></textarea>
                </div>
                <div class="config-row">
                  <label>开启用量统计</label>
                  <div>
                    <label class="switch">
                      <input type="checkbox" id="conf_usageEnabled">
                      <span class="slider"></span>
                    </label>
                  </div>
                </div>
                <div class="config-row">
                  <label>模型 1 Token 查询接口</label>
                  <input type="text" id="conf_summaryUsageUrl" placeholder="可选自定义 URL 模板">
                </div>
                <div class="config-row">
                  <label>模型 1 费用查询接口</label>
                  <input type="text" id="conf_summaryCostUrl" placeholder="可选自定义 URL 模板">
                </div>
                <div class="config-row">
                  <label>模型 2 Token 查询接口</label>
                  <input type="text" id="conf_scriptUsageUrl" placeholder="可选自定义 URL 模板">
                </div>
                <div class="config-row">
                  <label>模型 2 费用查询接口</label>
                  <input type="text" id="conf_scriptCostUrl" placeholder="可选自定义 URL 模板">
                </div>
              </div>
              
              <div class="config-actions">
                <button class="btn" id="saveConfigBtn" type="button">保存配置</button>
              </div>
            </div>
          </div>

        </main>
      </div>
    </div>
    <!-- 登录遮罩层 -->
    <div class="login-overlay" id="loginOverlay">
      <div class="login-panel">
        <h2>登录</h2>
        <div class="form-row">
          <label class="muted">账号</label>
          <input id="loginUser" type="text" autocomplete="username" placeholder="请输入账号">
        </div>
        <div class="form-row">
          <label class="muted">密码</label>
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <div class="actions">
          <button class="btn" id="loginBtn" type="button">登录</button>
          <span class="hint" id="loginHint"></span>
        </div>
      </div>
    </div>
    <script>
      // 页面元素引用
      const overlay = document.getElementById("loginOverlay");
      const loginBtn = document.getElementById("loginBtn");
      const loginHint = document.getElementById("loginHint");
      const refreshBtn = document.getElementById("refreshBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const exportBtn = document.getElementById("exportBtn");
      const filterSchool = document.getElementById("filterSchool");
      const filterSystemType = document.getElementById("filterSystemType");
      const filterFailureType = document.getElementById("filterFailureType");
      const failureSummary = document.getElementById("failureSummary");
      const summaryCards = document.getElementById("summaryCards");
      const schoolTableBody = document.querySelector("#schoolTable tbody");
      const failureTableBody = document.querySelector("#failureTable tbody");
      const headerMeta = document.getElementById("headerMeta");
      let currentData = null;

      // 导航切换逻辑
      const navItems = document.querySelectorAll('.nav-item');
      const pageSections = document.querySelectorAll('.page-section');
      const pageTitle = document.getElementById('pageTitle');
      
      navItems.forEach(item => {
        item.addEventListener('click', () => {
          const target = item.getAttribute('data-target');
          navItems.forEach(nav => nav.classList.remove('active'));
          item.classList.add('active');
          pageTitle.textContent = item.textContent.trim();
          
          pageSections.forEach(page => {
            if (page.id === target) {
              page.classList.add('active');
              if (target === 'page-config') loadConfig();
            } else {
              page.classList.remove('active');
            }
          });
        });
      });

      // 配置管理逻辑
      async function loadConfig() {
        try {
          const res = await fetch("/api/v1/admin/config", {
            headers: { Authorization: `Bearer ${getToken()}` }
          });
          if (res.status === 401) {
            clearToken();
            overlay.style.display = "flex";
            return;
          }
          const json = await res.json();
          if (json.code === 200) {
            const conf = json.data;
            document.getElementById("conf_summaryProviderRaw").value = conf.summaryProviderRaw || "auto";
            document.getElementById("conf_summaryModelRaw").value = conf.summaryModelRaw || "";
            document.getElementById("conf_summaryApiKey").value = conf.summaryApiKey || "";
            document.getElementById("conf_summaryBaseUrl").value = conf.summaryBaseUrl || "";
            document.getElementById("conf_summaryApiStyleRaw").value = conf.summaryApiStyleRaw || "";
            document.getElementById("conf_summaryRequestExtraJson").value = conf.summaryRequestExtraJson || "";

            document.getElementById("conf_scriptProviderRaw").value = conf.scriptProviderRaw || "auto";
            document.getElementById("conf_scriptModelRaw").value = conf.scriptModelRaw || "";
            document.getElementById("conf_scriptApiKey").value = conf.scriptApiKey || "";
            document.getElementById("conf_scriptBaseUrl").value = conf.scriptBaseUrl || "";
            document.getElementById("conf_scriptApiStyleRaw").value = conf.scriptApiStyleRaw || "";
            document.getElementById("conf_scriptRequestExtraJson").value = conf.scriptRequestExtraJson || "";

            document.getElementById("conf_modelAliasJson").value = conf.modelAliasJson || "";
            document.getElementById("conf_usageEnabled").checked = conf.usageEnabled;
            document.getElementById("conf_summaryUsageUrl").value = conf.summaryUsageUrl || "";
            document.getElementById("conf_summaryCostUrl").value = conf.summaryCostUrl || "";
            document.getElementById("conf_scriptUsageUrl").value = conf.scriptUsageUrl || "";
            document.getElementById("conf_scriptCostUrl").value = conf.scriptCostUrl || "";
          }
        } catch (e) {
          console.error("Failed to load config", e);
        }
      }

      document.getElementById("saveConfigBtn").addEventListener("click", async () => {
        const conf = {
          summaryProviderRaw: document.getElementById("conf_summaryProviderRaw").value,
          summaryModelRaw: document.getElementById("conf_summaryModelRaw").value,
          summaryApiKey: document.getElementById("conf_summaryApiKey").value,
          summaryBaseUrl: document.getElementById("conf_summaryBaseUrl").value,
          summaryApiStyleRaw: document.getElementById("conf_summaryApiStyleRaw").value,
          summaryRequestExtraJson: document.getElementById("conf_summaryRequestExtraJson").value,

          scriptProviderRaw: document.getElementById("conf_scriptProviderRaw").value,
          scriptModelRaw: document.getElementById("conf_scriptModelRaw").value,
          scriptApiKey: document.getElementById("conf_scriptApiKey").value,
          scriptBaseUrl: document.getElementById("conf_scriptBaseUrl").value,
          scriptApiStyleRaw: document.getElementById("conf_scriptApiStyleRaw").value,
          scriptRequestExtraJson: document.getElementById("conf_scriptRequestExtraJson").value,

          modelAliasJson: document.getElementById("conf_modelAliasJson").value,
          usageEnabled: document.getElementById("conf_usageEnabled").checked,
          summaryUsageUrl: document.getElementById("conf_summaryUsageUrl").value,
          summaryCostUrl: document.getElementById("conf_summaryCostUrl").value,
          scriptUsageUrl: document.getElementById("conf_scriptUsageUrl").value,
          scriptCostUrl: document.getElementById("conf_scriptCostUrl").value
        };

        const btn = document.getElementById("saveConfigBtn");
        const originalText = btn.textContent;
        btn.textContent = "保存中...";
        btn.disabled = true;

        try {
          const res = await fetch("/api/v1/admin/config", {
            method: "POST",
            headers: { 
              "Content-Type": "application/json",
              Authorization: `Bearer ${getToken()}` 
            },
            body: JSON.stringify(conf)
          });
          const json = await res.json();
          if (json.code === 200) {
            alert("配置保存成功");
          } else {
            alert(json.msg || "保存失败");
          }
        } catch (e) {
          alert("网络错误");
        } finally {
          btn.textContent = originalText;
          btn.disabled = false;
        }
      });

      const systemTypeLabels = {
        zhengfang: "正方",
        qiangzhi: "强智",
        kingosoft: "青果",
        chaoxing: "超星",
        unknown: "未知"
      };
      const failureTypeLabels = {
        validation: "校验失败",
        write: "写入失败",
        rollback: "回滚失败",
        unknown: "未知"
      };

      // Token 存取
      function getToken() {
        return localStorage.getItem("dawn_admin_token") || "";
      }
      function setToken(token) {
        localStorage.setItem("dawn_admin_token", token);
      }
      function clearToken() {
        localStorage.removeItem("dawn_admin_token");
      }
      // 格式化展示
      function formatTime(ts) {
        if (!ts) return "-";
        const date = new Date(ts);
        return `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
      }
      function formatCount(value) {
        return Number(value || 0).toLocaleString();
      }
      function formatCost(value) {
        return Number(value || 0).toFixed(4);
      }
      function formatTokens(value) {
        return Number(value || 0).toLocaleString();
      }
      function formatSystemType(value) {
        const key = value || "unknown";
        return systemTypeLabels[key] || key;
      }
      function formatFailureType(value) {
        const key = value || "unknown";
        return failureTypeLabels[key] || key;
      }
      function getSchoolInfo(data, schoolId) {
        return data.schoolInfoById?.[schoolId] || {};
      }
      function calcSuccessRate(success, failed, empty) {
        const total = success + failed + empty;
        if (total <= 0) return 0;
        return success / total;
      }
      // 渲染顶部汇总卡片
      function renderCards(data) {
        const metrics = data.metrics || {};
        const latestMetricsAt = data.latestMetricsAt || 0;
        const modelUsage = data.modelUsage || {};
        const summaryUsage = modelUsage.summary || {};
        const scriptUsage = modelUsage.script || {};
        const summarySub = summaryUsage.error
          ? `错误 ${summaryUsage.error}`
          : `费用 ${formatCost(summaryUsage.costTotal)}${summaryUsage.currency ? " " : ""}${
              summaryUsage.currency || ""
            } | 更新 ${formatTime(summaryUsage.updatedAt)}`;
        const scriptSub = scriptUsage.error
          ? `错误 ${scriptUsage.error}`
          : `费用 ${formatCost(scriptUsage.costTotal)}${scriptUsage.currency ? " " : ""}${
              scriptUsage.currency || ""
            } | 更新 ${formatTime(scriptUsage.updatedAt)}`;
        const cards = [
          {
            title: "解析成功",
            value: formatCount(metrics.parse_success?.count),
            sub: `平均耗时 ${Number(metrics.parse_success?.latencyMsAvg || 0).toFixed(1)} ms`
          },
          {
            title: "解析失败",
            value: formatCount(metrics.parse_failed?.count),
            sub: `空结果 ${formatCount(metrics.parse_empty?.count)}`
          },
          {
            title: "总结成功",
            value: formatCount(metrics.summary_success?.count),
            sub: `失败 ${formatCount(metrics.summary_failed?.count)}`
          },
          {
            title: "脚本修复成功",
            value: formatCount(metrics.script_success?.count),
            sub: `失败 ${formatCount(metrics.script_failed?.count)}`
          },
          {
            title: "学校数量",
            value: formatCount(data.schoolCount),
            sub: "出现过的学校"
          },
          {
            title: "队列总量",
            value: formatCount(data.totalQueueLength),
            sub: "待处理任务"
          },
          {
            title: "失败记录",
            value: formatCount(data.failureCount),
            sub: "最近 200 条内"
          },
          {
            title: "模型1 Token",
            value: formatTokens(summaryUsage.tokenTotal),
            sub: summarySub
          },
          {
            title: "模型2 Token",
            value: formatTokens(scriptUsage.tokenTotal),
            sub: scriptSub
          },
          {
            title: "模型费用",
            value: formatCost(
              (metrics.parse_success?.costTotal || 0) +
                (metrics.parse_failed?.costTotal || 0) +
                (metrics.parse_empty?.costTotal || 0) +
                (metrics.summary_success?.costTotal || 0) +
                (metrics.summary_failed?.costTotal || 0) +
                (metrics.script_success?.costTotal || 0) +
                (metrics.script_failed?.costTotal || 0)
            ),
            sub: `指标更新时间 ${formatTime(latestMetricsAt)}`
          }
        ];
        summaryCards.innerHTML = cards
          .map(
            (card) => `
          <div class="card">
            <h3>${card.title}</h3>
            <div class="value">${card.value}</div>
            <div class="sub">${card.sub}</div>
          </div>
        `
          )
          .join("");
      }
      // 渲染学校维度表格
      function renderSchools(data, filters) {
        const entries = Object.entries(data.schoolMetrics || {});
        entries.sort((a, b) => (b[1].lastUpdatedAt || 0) - (a[1].lastUpdatedAt || 0));
        const filtered = entries.filter(([schoolId]) => {
          const info = getSchoolInfo(data, schoolId);
          if (filters.schoolId && schoolId !== filters.schoolId) return false;
          if (filters.systemType && (info.schoolSystemType || "unknown") !== filters.systemType) {
            return false;
          }
          return true;
        });
        schoolTableBody.innerHTML = filtered
          .map(([schoolId, info]) => {
            const queueLen = data.schoolQueues?.[schoolId] ?? 0;
            const rate = calcSuccessRate(info.parse_success, info.parse_failed, info.parse_empty);
            const badgeClass = rate >= 0.8 ? "success" : rate >= 0.5 ? "warning" : "danger";
            const schoolInfo = getSchoolInfo(data, schoolId);
            return `
            <tr>
              <td>${schoolId}</td>
              <td>${schoolInfo.schoolName || "-"}</td>
              <td>${formatSystemType(schoolInfo.schoolSystemType)}</td>
              <td><span class="badge">${queueLen}</span></td>
              <td><span class="badge ${badgeClass}">${(rate * 100).toFixed(1)}%</span></td>
              <td>${info.parse_success}/${info.parse_failed}/${info.parse_empty}</td>
              <td>${info.summary_success}/${info.summary_failed}</td>
              <td>${info.script_success}/${info.script_failed}</td>
              <td>${formatCost(info.costTotal)}</td>
              <td>${formatTime(info.lastUpdatedAt)}</td>
            </tr>
          `;
          })
          .join("");
        if (!filtered.length) {
          schoolTableBody.innerHTML = `<tr><td colspan="10" class="muted">暂无数据</td></tr>`;
        }
      }
      // 渲染失败记录
      function renderFailures(data, filters) {
        const list = (data.failures || []).filter((item) => {
          const schoolId = item.schoolId || "";
          const schoolInfo = getSchoolInfo(data, schoolId);
          if (filters.schoolId && schoolId !== filters.schoolId) return false;
          if (filters.systemType && (schoolInfo.schoolSystemType || "unknown") !== filters.systemType) {
            return false;
          }
          if (filters.failureType && (item.failureType || "unknown") !== filters.failureType) {
            return false;
          }
          return true;
        });
        failureTableBody.innerHTML = list
          .map(
            (item) => `
          <tr>
            <td>${item.schoolId || "-"}</td>
            <td>${item.scriptName || "-"}</td>
            <td>${formatFailureType(item.failureType)}</td>
            <td>${item.reason || "-"}</td>
            <td>${formatTime(item.createdAt)}</td>
          </tr>
        `
          )
          .join("");
        if (!list.length) {
          failureTableBody.innerHTML = `<tr><td colspan="5" class="muted">暂无失败记录</td></tr>`;
        }
        renderFailureSummary(list);
        return list;
      }
      function renderFailureSummary(failures) {
        const stats = {};
        failures.forEach((item) => {
          const type = item.failureType || "unknown";
          stats[type] = (stats[type] || 0) + 1;
        });
        const entries = Object.entries(stats);
        if (!entries.length) {
          failureSummary.innerHTML = `<span class="muted">暂无失败统计</span>`;
          return;
        }
        failureSummary.innerHTML = entries
          .map(
            ([type, count]) =>
              `<span class="badge">${formatFailureType(type)} ${formatCount(count)}</span>`
          )
          .join("");
      }
      // 带登录态的请求封装
      async function fetchWithAuth(path) {
        const token = getToken();
        const res = await fetch(path, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });
        if (res.status === 401) {
          throw new Error("unauthorized");
        }
        return res.json();
      }
      // 拉取并刷新页面数据
      async function refreshData() {
        const result = await fetchWithAuth("/api/v1/admin/data");
        const data = result.data || {};
        currentData = data;
        headerMeta.textContent = `启动时间：${formatTime(
          data.serverStartedAt
        )} | 指标刷新：${formatTime(data.latestMetricsAt)} | 最后刷新：${formatTime(
          Date.now()
        )} | 统计文件：${data.metricsFile || "-"}`;
        renderCards(data);
        updateFilterOptions(data);
        applyFilters();
      }
      function updateFilterOptions(data) {
        const schoolIds = new Set([
          ...Object.keys(data.schoolMetrics || {}),
          ...Object.keys(data.schoolInfoById || {})
        ]);
        const schoolOptions = ["", ...Array.from(schoolIds).sort()];
        const currentSchool = filterSchool.value;
        filterSchool.innerHTML = schoolOptions
          .map((id) => {
            if (!id) return `<option value="">全部学校</option>`;
            const info = getSchoolInfo(data, id);
            const label = info.schoolName ? `${id}（${info.schoolName}）` : id;
            return `<option value="${id}">${label}</option>`;
          })
          .join("");
        if (currentSchool) filterSchool.value = currentSchool;

        const systemTypes = new Set(
          Object.values(data.schoolInfoById || {}).map((item) => item.schoolSystemType || "unknown")
        );
        const systemOptions = ["", ...Array.from(systemTypes).sort()];
        const currentSystem = filterSystemType.value;
        filterSystemType.innerHTML = systemOptions
          .map((type) => {
            if (!type) return `<option value="">全部类型</option>`;
            return `<option value="${type}">${formatSystemType(type)}</option>`;
          })
          .join("");
        if (currentSystem) filterSystemType.value = currentSystem;

        const failureTypes = new Set(Object.keys(data.failureTypeStats || {}));
        const failureOptions = ["", ...Array.from(failureTypes).sort()];
        const currentFailure = filterFailureType.value;
        filterFailureType.innerHTML = failureOptions
          .map((type) => {
            if (!type) return `<option value="">全部失败类型</option>`;
            return `<option value="${type}">${formatFailureType(type)}</option>`;
          })
          .join("");
        if (currentFailure) filterFailureType.value = currentFailure;
      }
      function applyFilters() {
        if (!currentData) return;
        const filters = {
          schoolId: filterSchool.value || "",
          systemType: filterSystemType.value || "",
          failureType: filterFailureType.value || ""
        };
        renderSchools(currentData, filters);
        renderFailures(currentData, filters);
      }
      function escapeCsv(value) {
        const text = `${value ?? ""}`;
        if (text.includes('"') || text.includes(",") || text.includes("\n")) {
          return `"${text.replace(/"/g, '""')}"`;
        }
        return text;
      }
      function buildCsvContent(data, filters) {
        const lines = [];
        lines.push("学校统计");
        lines.push(
          [
            "学校ID",
            "学校名称",
            "教务系统",
            "队列",
            "解析成功",
            "解析失败",
            "解析空",
            "总结成功",
            "总结失败",
            "脚本成功",
            "脚本失败",
            "费用",
            "最近更新"
          ].join(",")
        );
        Object.entries(data.schoolMetrics || {}).forEach(([schoolId, info]) => {
          const schoolInfo = getSchoolInfo(data, schoolId);
          if (filters.schoolId && schoolId !== filters.schoolId) return;
          if (filters.systemType && (schoolInfo.schoolSystemType || "unknown") !== filters.systemType) {
            return;
          }
          lines.push(
            [
              schoolId,
              schoolInfo.schoolName || "",
              formatSystemType(schoolInfo.schoolSystemType),
              data.schoolQueues?.[schoolId] ?? 0,
              info.parse_success,
              info.parse_failed,
              info.parse_empty,
              info.summary_success,
              info.summary_failed,
              info.script_success,
              info.script_failed,
              formatCost(info.costTotal),
              formatTime(info.lastUpdatedAt)
            ]
              .map(escapeCsv)
              .join(",")
          );
        });
        lines.push("");
        lines.push("失败记录");
        lines.push(["学校ID", "脚本", "类型", "原因", "时间"].join(","));
        (data.failures || []).forEach((item) => {
          const schoolId = item.schoolId || "";
          const schoolInfo = getSchoolInfo(data, schoolId);
          if (filters.schoolId && schoolId !== filters.schoolId) return;
          if (filters.systemType && (schoolInfo.schoolSystemType || "unknown") !== filters.systemType) {
            return;
          }
          if (filters.failureType && (item.failureType || "unknown") !== filters.failureType) return;
          lines.push(
            [
              schoolId,
              item.scriptName || "",
              formatFailureType(item.failureType),
              item.reason || "",
              formatTime(item.createdAt)
            ]
              .map(escapeCsv)
              .join(",")
          );
        });
        return `\ufeff${lines.join("\n")}`;
      }
      function exportCsv() {
        if (!currentData) return;
        const filters = {
          schoolId: filterSchool.value || "",
          systemType: filterSystemType.value || "",
          failureType: filterFailureType.value || ""
        };
        const csv = buildCsvContent(currentData, filters);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `dawncourse_stats_${Date.now()}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }
      // 检查登录态并展示页面
      async function checkSession() {
        try {
          await fetchWithAuth("/api/v1/admin/session");
          overlay.style.display = "none";
          await refreshData();
        } catch {
          overlay.style.display = "flex";
        }
      }
      // 登录逻辑
      loginBtn.addEventListener("click", async () => {
        loginHint.textContent = "";
        const username = document.getElementById("loginUser").value.trim();
        const password = document.getElementById("loginPass").value.trim();
        if (!username || !password) {
          loginHint.textContent = "请输入账号和密码";
          return;
        }
        const res = await fetch("/api/v1/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        if (!res.ok) {
          loginHint.textContent = "账号或密码错误";
          return;
        }
        const result = await res.json();
        setToken(result.data.token);
        overlay.style.display = "none";
        await refreshData();
      });
      // 手动刷新
      refreshBtn.addEventListener("click", async () => {
        await refreshData();
      });
      exportBtn.addEventListener("click", () => {
        exportCsv();
      });
      filterSchool.addEventListener("change", () => {
        applyFilters();
      });
      filterSystemType.addEventListener("change", () => {
        applyFilters();
      });
      filterFailureType.addEventListener("change", () => {
        applyFilters();
      });
      // 退出登录
      logoutBtn.addEventListener("click", async () => {
        try {
          await fetchWithAuth("/api/v1/admin/logout");
        } catch {}
        clearToken();
        overlay.style.display = "flex";
      });
      // 初始化检查
      checkSession();
      // 定时刷新页面数据
      setInterval(async () => {
        if (overlay.style.display === "none") {
          try {
            await refreshData();
          } catch {}
        }
      }, 10000);
    </script>
  </body>
</html>
