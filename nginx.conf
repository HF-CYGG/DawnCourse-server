events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /shared/parsers/nginx_access.log;
  error_log /shared/parsers/nginx_error.log warn;
  server {
    # 对外监听端口
    listen 80;
    listen 15000;
    server_name _;
    # 静态脚本与资源目录
    root /usr/share/nginx/html;
    # LLM 兜底解析接口反向代理
    location /api/v1/ {
      set $backend_upstream "127.0.0.1:8080";
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_intercept_errors on;
      error_page 502 503 504 = @api_backend_unavailable;
    }
    location @api_backend_unavailable {
      default_type application/json;
      return 503 '{"code":503,"msg":"llm backend unavailable"}';
    }
    location = /admin {
      return 302 /admin/;
    }
    location /admin/ {
      try_files $uri /admin/index.html;
    }
    location /scripts/parsers/ {
      alias /shared/parsers/;
      log_not_found off;
      error_page 404 = @parsers_fallback;
    }
    location @parsers_fallback {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }
    # 其余路径继续走静态资源
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
