# nginx 对外入口：提供静态资源访问、/api/v1 反向代理与 Docker 内部服务发现兜底。
events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /shared/parsers/nginx_access.log;
  error_log /shared/parsers/nginx_error.log warn;
  # 显式使用 Docker 内置 DNS，避免 llm-backend 服务名在运行期重解析时超时或失效
  resolver __NGINX_DNS_RESOLVER__ valid=30s ipv6=off;
  resolver_timeout 5s;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=admin_per_ip:10m rate=60r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  # 安全加固：屏蔽无效或恶意的 User-Agent，例如常见的扫描器
  map $http_user_agent $bad_client {
      default 0;
      ~*(CensysInspect|Nmap|Go-http-client|zgrab|masscan|sqlmap|Netsparker) 1;
  }

  server {
    # 对外监听端口
    listen 80;
    listen 15000;
    server_name _;
    client_max_body_size 2m;
    limit_conn conn_per_ip 30;

    # 屏蔽恶意扫描器
    if ($bad_client) {
        return 403;
    }

    # 安全加固：防止作为代理服务器被滥用 (CONNECT/PRI)
    if ($request_method !~ ^(GET|POST|HEAD)$ ) {
        return 405;
    }

    # 静态脚本与资源目录
    root /usr/share/nginx/html;
    # 通过变量触发 nginx 在请求期结合 resolver 动态解析 llm-backend，避免容器重建后继续使用陈旧地址
    set $llm_backend_upstream "__LLM_BACKEND_UPSTREAM__";
    # 管理端“强制修复”会同步等待大模型修复完成，耗时明显长于普通 API
    # 单独放宽超时，避免 Nginx 在后端仍在处理时提前返回 504
    location ~ ^/api/v1/admin/repair/issues/[^/]+/force-repair$ {
      limit_req zone=admin_per_ip burst=20 nodelay;
      proxy_pass http://$llm_backend_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
      proxy_next_upstream off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_intercept_errors on;
      error_page 502 503 504 = @api_backend_unavailable;
    }
    # 对外统一健康检查入口：只有 nginx 可访问且 llm-backend 正常响应时才返回成功
    location = /health {
      proxy_pass http://$llm_backend_upstream/health;
      proxy_http_version 1.1;
      proxy_connect_timeout 3s;
      proxy_send_timeout 3s;
      proxy_read_timeout 3s;
      proxy_next_upstream off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_intercept_errors on;
      error_page 502 503 504 = @api_backend_unavailable;
    }
    # LLM 兜底解析接口反向代理
    location /api/v1/ {
      limit_req zone=api_per_ip burst=120 nodelay;
      proxy_pass http://$llm_backend_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_intercept_errors on;
      proxy_buffering off;
      error_page 502 503 504 = @api_backend_unavailable;
    }
    location @api_backend_unavailable {
      default_type application/json;
      return 503 '{"code":503,"msg":"llm backend unavailable"}';
    }
    location = /admin {
      return 302 /admin/;
    }
    location /admin/ {
      limit_req zone=admin_per_ip burst=60 nodelay;
      try_files $uri /admin/index.html;
    }
    location ~ ^/scripts/parsers/(?<parser_file>[^/]+)$ {
      root /;
      try_files /shared/parsers/$parser_file /usr/share/nginx/html/scripts/parsers/$parser_file =404;
    }
    location ~ ^/scripts/js/(?<js_file>[^/]+)$ {
      root /;
      try_files /shared/parsers/$js_file /usr/share/nginx/html/scripts/js/$js_file =404;
    }
    # 其余路径继续走静态资源
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
