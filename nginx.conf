events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /shared/parsers/nginx_access.log;
  error_log /shared/parsers/nginx_error.log warn;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=admin_per_ip:10m rate=60r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  # 安全加固：屏蔽无效或恶意的 User-Agent，例如常见的扫描器
  map $http_user_agent $bad_client {
      default 0;
      ~*(CensysInspect|Nmap|Go-http-client|zgrab|masscan|sqlmap|Netsparker) 1;
  }

  server {
    # 对外监听端口
    listen 80;
    listen 15000;
    server_name _;
    client_max_body_size 2m;
    limit_conn conn_per_ip 30;

    # 屏蔽恶意扫描器
    if ($bad_client) {
        return 403;
    }

    # 安全加固：防止作为代理服务器被滥用 (CONNECT/PRI)
    if ($request_method !~ ^(GET|POST|HEAD)$ ) {
        return 405;
    }

    # 静态脚本与资源目录
    root /usr/share/nginx/html;
    # 管理端“强制修复”会同步等待大模型修复完成，耗时明显长于普通 API
    # 单独放宽超时，避免 Nginx 在后端仍在处理时提前返回 504
    location ~ ^/api/v1/admin/repair/issues/[^/]+/force-repair$ {
      limit_req zone=admin_per_ip burst=20 nodelay;
      proxy_pass http://__LLM_BACKEND_UPSTREAM__;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
      proxy_next_upstream off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_intercept_errors on;
      error_page 502 503 504 = @api_backend_unavailable;
    }
    # LLM 兜底解析接口反向代理
    location /api/v1/ {
      limit_req zone=api_per_ip burst=120 nodelay;
      proxy_pass http://__LLM_BACKEND_UPSTREAM__;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_intercept_errors on;
      error_page 502 503 504 = @api_backend_unavailable;
    }
    location @api_backend_unavailable {
      default_type application/json;
      return 503 '{"code":503,"msg":"llm backend unavailable"}';
    }
    location = /admin {
      return 302 /admin/;
    }
    location /admin/ {
      limit_req zone=admin_per_ip burst=60 nodelay;
      try_files $uri /admin/index.html;
    }
    location /scripts/parsers/ {
      alias /shared/parsers/;
      try_files $uri $uri/ @parsers_fallback;
    }
    location @parsers_fallback {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }
    location /scripts/js/ {
      alias /shared/parsers/;
      try_files $uri $uri/ @js_fallback;
    }
    location @js_fallback {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }
    # 其余路径继续走静态资源
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
