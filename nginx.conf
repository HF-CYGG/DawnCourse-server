events {}
http {
  server {
    # 对外监听端口
    listen 80;
    server_name _;
    # 静态脚本与资源目录
    root /usr/share/nginx/html;
    # LLM 兜底解析接口反向代理
    location /api/v1/ {
      proxy_pass http://llm-backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /admin {
      return 302 /admin/;
    }
    location /admin/ {
      try_files $uri /admin/index.html;
    }
    location /scripts/parsers/ {
      alias /shared/parsers/;
      try_files $uri @parsers_fallback;
    }
    location @parsers_fallback {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }
    # 其余路径继续走静态资源
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
